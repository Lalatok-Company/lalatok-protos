syntax = "proto3";

package otp;

// This is the Go package name
option go_package = "otppb/";

// OTP service
service OtpService {
  rpc Create(CreateRequest) returns (CreateResponse);
  rpc Verify(VerifyRequest) returns (VerifyResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc RetryOTP(RetryOTPRequest) returns (RetryOTPResponse);
  rpc ResetRetryOtp(ResetRetryOtpRequest) returns (ResetRetryOtpResponse);
}

// Details of one delivered code; send_id identifies this send in the audit log
message OtpSendInfo {
  string send_id = 1;
  string provider = 2;
  string channel = 3;
  int64 sent_at_ms = 4;
  int64 expires_at_ms = 5;
  bool is_test = 6;
}

// Why a verify did not pass; a wrong or burned code is not an error
enum VerifyOutcome {
  VERIFY_OUTCOME_UNSPECIFIED = 0;
  VERIFY_OUTCOME_OK = 1;
  VERIFY_OUTCOME_WRONG_CODE = 2;
  VERIFY_OUTCOME_LOCKED = 3;
  VERIFY_OUTCOME_NOT_FOUND = 4;
}

// Create OTP request and response
message CreateRequest {
  string phone_number = 1;
}

message CreateResponse {
  bool status = 1;
  // Set when a code was delivered
  OtpSendInfo send = 2;
}

// Verify OTP request and response
message VerifyRequest {
  string phone_number = 1;
  string code = 2;
}

message VerifyResponse {
  bool status = 1;
  // Send this verify was checked against; empty when no code was stored
  string send_id = 2;
  VerifyOutcome outcome = 3;
  // Wrong codes entered for this send so far, and the limit before it is burned
  int32 wrong_attempts = 4;
  int32 max_attempts = 5;
}

// Get OTP request and response
message GetRequest {
  string phone_number = 1;
}

message GetResponse {
   string code = 1;
}

// Send message request and response
message SendMessageRequest {
  string phone_number = 1;
  string message = 2;
}

message SendMessageResponse {
  bool status = 1;
}

// Retry OTP request and response
message RetryOTPRequest {
  string phone_number = 1;
  int32 attempt = 2;
}

message RetryOTPResponse {
  bool status = 1;
  // Set when a new code was delivered
  OtpSendInfo send = 2;
}

message ResetRetryOtpRequest {
  string phone_number = 1;
}

message ResetRetryOtpResponse {
  bool status = 1;
}