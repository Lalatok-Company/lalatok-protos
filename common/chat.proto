syntax = "proto3";

package chat;

option go_package = "chatpb/";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

// ChatService defines all chat-related operations
service ChatService {
  // Chat Room Management
  // CreateChatRoom removed (Phase 6, D-19 #4): it was declared but never implemented server-side, and its only caller path was unreachable because GetChatRoomByParticipants already creates a direct-pair room on demand. GetChatRoomByParticipants is now the single, documented creation path.
  rpc GetChatRoom(GetChatRoomRequest) returns (GetChatRoomResponse) {}
  rpc SearchChatRooms(SearchChatRoomsRequest) returns (SearchChatRoomsResponse) {}
  rpc SearchChatRoomsByUsername(SearchChatRoomsByUsernameRequest) returns (SearchChatRoomsByUsernameResponse) {}
  rpc GetChatRoomsByAccountID(GetChatRoomsByAccountIDRequest) returns (GetChatRoomsByAccountIDResponse) {}
  rpc LeaveChat(LeaveChatRequest) returns (google.protobuf.Empty) {}
  rpc DeclineAllPendingChatForAccount(DeclineAllPendingChatForAccountRequest) returns (google.protobuf.Empty) {}
  rpc MuteChat(MuteChatRequest) returns (google.protobuf.Empty) {}
  rpc UnmuteChat(UnmuteChatRequest) returns (google.protobuf.Empty) {}
  rpc ChangeBackground(ChangeBackgroundRequest) returns (google.protobuf.Empty) {}
  rpc GetChatRoomByParticipants(GetChatRoomByParticipantsRequest) returns (GetChatRoomByParticipantsResponse) {}

  // Message Management
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse) {}
  rpc GetMessages(GetMessagesRequest) returns (GetMessagesResponse) {}
  rpc LikeMessage(LikeMessageRequest) returns (LikeMessageResponse) {}
  rpc UnlikeMessage(UnlikeMessageRequest) returns (UnlikeMessageResponse) {}
  rpc MarkMessagesAsRead(MarkMessagesAsReadRequest) returns (google.protobuf.Empty) {}
  // Phase 3 — total unread messages across all of the account's rooms.
  rpc GetUnreadMessageCount(GetUnreadMessageCountRequest) returns (GetUnreadMessageCountResponse) {}

  // Participant Status Management (Simplified Chat System)
  rpc UpdateParticipantStatus(UpdateParticipantStatusRequest) returns (google.protobuf.Empty) {}
  rpc GetChatRoomsByParticipantStatus(GetChatRoomsByParticipantStatusRequest) returns (GetChatRoomsByParticipantStatusResponse) {}

  // Mute/Unmute/Status
  rpc GetMuteStatus(GetMuteStatusRequest) returns (GetMuteStatusResponse) {};

  // Participant username management
  rpc UpdateParticipantUsername(UpdateParticipantUsernameRequest) returns (UpdateParticipantUsernameResponse);

  // Daily chats started, chats replied, messages and senders for the admin dashboard
  rpc GetChatActivityStats(GetChatActivityStatsRequest) returns (GetChatActivityStatsResponse) {}
  // AI persona conversation totals over every tracked day, for the admin dashboard
  rpc GetChatHistoryStats(GetChatHistoryStatsRequest) returns (GetChatHistoryStatsResponse) {}
}

// Search Request
message SearchChatRoomsRequest {
  string account_id = 1;
  string search_query = 2;  // Can be username or chat room name
  int32 limit = 3;
  string next_page_token = 4; // base64-encoded Cassandra paging state
}

message SearchChatRoomsResponse {
  repeated ChatRoom chat_rooms = 1;
  string next_page_token = 2; // base64-encoded Cassandra paging state for next page, empty if no more
}

// New Request/Response for username-specific search
message SearchChatRoomsByUsernameRequest {
  string current_account_id = 1; // ID of the user performing the search
  string username_query = 2;     // Username string to search for in other participants
  int32 limit = 3;
  string page_state = 4;       // Opaque token for pagination (base64 encoded Cassandra page state)
}

message SearchChatRoomsByUsernameResponse {
  repeated ChatRoom chat_rooms = 1;
  string next_page_state = 2;  // Opaque token for the next page, empty if no more pages
}

// Chat Room Messages
message CreateChatRoomRequest {
  string creator_account_id = 1;
  repeated string participants = 2;
  string name = 3;           // Optional for group chats
  string description = 4;    // Optional
  string initial_message = 5; // Optional first message
}

message CreateChatRoomResponse {
  ChatRoom chat_room = 1;
}

message GetChatRoomRequest {
  string account_id = 1;
  string chat_room_id = 2;
}

message GetChatRoomResponse {
  ChatRoom chat_room = 1;
}

message GetChatRoomsByAccountIDRequest {
  string account_id = 1;
  int32 limit = 2;
  string next_page_token = 3; // base64-encoded Cassandra paging state
}

message GetChatRoomsByAccountIDResponse {
  repeated ChatRoom chat_rooms = 1;
  string next_page_token = 2; // base64-encoded Cassandra paging state for next page, empty if no more
}

message LeaveChatRequest {
  string chat_room_id = 1;
  string account_id = 2;
}

message DeclineAllPendingChatForAccountRequest {
  string account_id = 1;
}

message MuteChatRequest {
  string chat_room_id = 1;
  string account_id = 2;
}

message UnmuteChatRequest {
  string chat_room_id = 1;
  string account_id = 2;
}

message ChangeBackgroundRequest {
  string chat_room_id = 1;
  string account_id = 2;
  string background_url = 3;
}

// Message Messages
message SendMessageRequest {
  string chat_room_id = 1;
  string sender_account_id = 2;
  string receiver_account_id = 3;  // Optional, for private messages
  string content = 4;
  string message_type = 5;
  string metadata = 6;  // JSON string preserving original types
  string reply_to_message_id = 7;    // Optional, for reply messages
  string reply_to_photo_id = 8;
  bool isBlocked = 9;
}

message SendMessageResponse {
  Message message = 1;
}

message GetMessagesRequest {
  string chat_room_id = 1;
  string account_id = 2;
  int32 limit = 3;
  string next_page_token = 4; // base64-encoded Cassandra paging state
  google.protobuf.Timestamp before = 5;  // Optional, for pagination
  repeated string message_types = 6; // Optional, filter by message types
}

message GetMessagesResponse {
  repeated Message messages = 1;
  string next_page_token = 2; // base64-encoded Cassandra paging state for next page, empty if no more
  bool has_more = 3;
}

message LikeMessageRequest {
  string message_id = 1;
  string account_id = 2;
  string chat_room_id = 3;
  google.protobuf.Timestamp created_at = 4;
}

message UnlikeMessageRequest {
  string message_id = 1;
  string account_id = 2;
}

message LikeMessageResponse {
  string message_id = 1;
  string room_id = 2;
  repeated string participants_ids = 3;
}

message UnlikeMessageResponse {
  string message_id = 1;
  string room_id = 2;
  repeated string participants_ids = 3;
}

// Common Messages
message ChatRoom {
  string id = 1;
  string name = 2;
  string description = 3;
  string creator_account_id = 4;
  repeated Participant participants = 5;
  Message last_message = 6;
  string status = 7;
  string background_url = 8;
  string background = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  bool is_group = 16;
  int32 unread_count = 17;
  // Phase 7 (D-07): how this room was created. `direct_request` means it was opened through
  // POST /chat/direct and the one-message-until-accepted rule applies; anything else, INCLUDING
  // the empty string on every room that predates this field, means an ordinary unrestricted room
  // (D-10's grandfather clause, no backfill).
  string origin = 18;
}

// Participant represents a user in a chat room with their status and roles
message Participant {
  string account_id = 1;
  string role = 2;                   // admin, member
  bool is_muted = 3;
  google.protobuf.Timestamp joined_at = 4;
  google.protobuf.Timestamp last_read_at = 5;
  string status = 6;                 // joined, pending, declined, blocked (replaces separate chat request concept)
  string username = 7;
  string background = 8;
  // Phase 6 (D-05): this account has already spent its single message into a not-yet-accepted room. Read by the BFF gate from the participants array it already fetches, so the second-message refusal costs no extra round trip and no speculative quota reserve.
  bool opener_sent = 9;
}

message Message {
  string id = 1;
  string chat_room_id = 2;
  string sender_account_id = 3;
  string receiver_account_id = 4;  // For private messages
  string content = 5;
  string message_type = 6;
  string metadata = 7;  // JSON string preserving original types
  string reply_to_message_id = 8;
  repeated string liked_by = 9;
  string status = 10;  // sent, delivered, read
  bool is_private = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  Message reply_to_message = 14;
  string reply_to_photo_id = 15;
  bool is_blocked = 16;
}

message MarkMessagesAsReadRequest {
  string chat_room_id = 1;
  string account_id = 2;
  google.protobuf.Timestamp until_time = 3;
}

// Phase 3 — aggregate unread-message count for an account (summed across all rooms).
message GetUnreadMessageCountRequest {
  string account_id = 1;
}

message GetUnreadMessageCountResponse {
  int32 unread_count = 1;
}

message GetChatRoomByParticipantsRequest {
  repeated string participant_ids = 1;
  // Phase 7 (D-05): when true, do not create a room on a miss; answer `exists = false` instead.
  // Default false is exactly today's get-or-create behaviour, so every existing caller is
  // unaffected.
  bool suppress_auto_create = 2;
  // Phase 7 (D-07): the origin to stamp on a room this call actually CREATES. Ignored when an
  // existing room is found; origin is set-once at creation and is never overwritten by a later
  // lookup. Empty means the message service's own default.
  string origin = 3;
}

message GetChatRoomByParticipantsResponse {
  bool exists = 1;
  ChatRoom chat_room = 2;
  // Phase 7 (D-10): true only when THIS call created the room. The repository has always
  // returned this bool internally (chat_repository.go, the found branch returns false and
  // prepareAndCreateNewChatRoom returns true); the RPC layer discarded it and hardcoded
  // `exists: true`, which made "found" and "just created" indistinguishable on the wire.
  bool is_created = 3;
}

// Participant Status Management
message UpdateParticipantStatusRequest {
  string chat_room_id = 1;
  string account_id = 2;
  string status = 3; // joined, pending, declined, blocked
  string updated_by = 4; // account_id of the user who updated the status
}

message GetChatRoomsByParticipantStatusRequest {
  string account_id = 1;
  string status = 2; // joined, pending, declined, blocked
  int32 limit = 3;
  string next_page_token = 4;
}

message GetChatRoomsByParticipantStatusResponse {
  repeated ChatRoom chat_rooms = 1;
  string next_page_token = 2;
}

message GetMuteStatusRequest {
  string chat_room_id = 1;
  string account_id = 2;
}

message GetMuteStatusResponse {
  bool is_muted = 1;
  google.protobuf.Timestamp muted_until = 2;
}

// Request and Response for updating participant username
message UpdateParticipantUsernameRequest {
  string account_id = 1; // UUID of the account whose username is to be updated
  string new_username = 2;
}

message UpdateParticipantUsernameResponse {
  bool success = 1; // Indicates if the update process was initiated successfully
  // Optionally, add an error message string here if needed, though gRPC errors are preferred.
}

// Dates are YYYY-MM-DD Vietnam calendar days. Chats with an excluded participant are left out.
message GetChatActivityStatsRequest {
  string start_date = 1;
  string end_date = 2;
  repeated string exclude_account_ids = 3;
  // AI persona accounts. Chats between a real member and one of them make up the with_personas
  // scope. They may also be listed in exclude_account_ids.
  repeated string persona_account_ids = 4;
  // Fills senders and recipients in both scopes.
  bool include_accounts = 5;
}

// has_data is false for days before activity tracking started.
// The reply24 fields count conversations whose first message falls on the day and whose
// recipient is a real member: eligible conversations have a full 24 hour window behind them,
// replied ones got a recipient reply within 24 hours, and pending ones are not yet 24 hours old
// (they are left out of eligible).
message ChatActivityDay {
  string date = 1;
  int64 chats_started = 2;
  int64 chats_replied = 3;
  int64 messages = 4;
  int64 senders = 5;
  bool has_data = 6;
  int64 reply24_eligible = 7;
  int64 reply24_replied = 8;
  int64 reply24_pending = 9;
}

// messages counts what the account sent; the reply24 fields count conversations where the
// account was the recipient.
message ChatAccountStat {
  string account_id = 1;
  int64 messages = 2;
  int64 reply24_eligible = 3;
  int64 reply24_replied = 4;
  int64 reply24_pending = 5;
}

// One scope of the chat counters. senders lists the real accounts that sent messages, recipients
// the real accounts that received a conversation start; both are only filled when
// include_accounts is set.
message ChatScopeStats {
  repeated ChatActivityDay days = 1;
  int64 chats_started_total = 2;
  int64 chats_replied_total = 3;
  int64 messages_total = 4;
  int64 senders_total = 5;
  int64 reply24_eligible_total = 6;
  int64 reply24_replied_total = 7;
  int64 reply24_pending_total = 8;
  repeated ChatAccountStat senders = 9;
  repeated ChatAccountStat recipients = 10;
}

// Fields 1-6 keep their meaning and equal the members scope.
message GetChatActivityStatsResponse {
  repeated ChatActivityDay days = 1;
  int64 chats_started_total = 2;
  int64 chats_replied_total = 3;
  int64 messages_total = 4;
  int64 senders_total = 5;
  string tracking_since = 6; // YYYY-MM-DD, first day with activity tracking
  // Chats between two real members.
  ChatScopeStats members = 7;
  // Chats between a real member and an AI persona.
  ChatScopeStats with_personas = 8;
}

// Covers every tracked day; there is no date range.
message GetChatHistoryStatsRequest {
  repeated string persona_account_ids = 1;
  repeated string exclude_account_ids = 2;
}

// persona_started counts tracked conversations an AI persona started with a real member, and
// persona_replied those of them the member replied to. members_replied is the distinct real
// members who replied after a persona started the conversation. member_messages and
// persona_messages count messages between real members and between real members and personas.
message GetChatHistoryStatsResponse {
  int64 persona_started = 1;
  int64 persona_replied = 2;
  int64 members_replied = 3;
  string tracking_since = 4; // YYYY-MM-DD, first day with activity tracking
  int64 member_messages = 5;
  int64 persona_messages = 6;
}
