syntax = "proto3";

package social;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// This is the Go package name
option go_package = "socialpb/";

service SocialService {
  // Follow
  rpc Follow(FollowRequest) returns (FollowResponse);
  rpc Unfollow(UnfollowRequest) returns (UnfollowResponse);
  rpc IsFollow(IsFollowRequest) returns (IsFollowResponse);

  rpc GetFollowers(GetFollowersRequest) returns (GetFollowersResponse);
  rpc GetFollowing(GetFollowingRequest) returns (GetFollowingResponse);

  // Friends
  rpc AddFriend(AddFriendRequest) returns (AddFriendResponse);
  rpc GetFriendRequests(GetFriendRequestsRequest) returns (GetFriendRequestsResponse);
  rpc GetSendFriendRequests(GetSendFriendRequestsRequest) returns (GetSendFriendRequestsResponse);
  rpc AcceptFriend(AcceptFriendRequest) returns (AcceptFriendResponse);
  rpc RejectFriend(RejectFriendRequest) returns (RejectFriendResponse);
  rpc GetAllFriendRequests(GetAllFriendRequestsRequest) returns (GetAllFriendRequestsResponse);
  
  rpc GetFriends(GetFriendsRequest) returns (GetFriendsResponse);
  rpc IsFriend(IsFriendRequest) returns (IsFriendResponse);
  rpc UnFriend(UnFriendRequest) returns (UnFriendResponse);

  // Additional methods for friends
  rpc GetRelationshipByAccountId(GetRelationshipByAccountIdRequest) returns (GetRelationshipByAccountIdResponse);
  rpc GetRelationshipByAccountIds(GetRelationshipByAccountIdsRequest) returns (GetRelationshipByAccountIdsResponse);

  rpc GetFollowersCount(GetFollowersCountRequest) returns (GetFollowersCountResponse);

  // Reset all relationships between two users
  rpc ResetRelationship(ResetRelationshipRequest) returns (ResetRelationshipResponse);

  // coming
  rpc CreateComing(CreateComingReq) returns (google.protobuf.Empty);
  rpc GetComing(GetComingReq) returns (GetComingRes);
  rpc DeleteComing(DeleteComingReq) returns (google.protobuf.Empty);
  rpc DeleteAllComingsByUserID(DeleteAllComingsByUserIDReq) returns (google.protobuf.Empty);

  // Get suggested friends
  rpc GetSuggestedFriends(GetSuggestedFriendsReq) returns (GetSuggestedFriendsRes);

  // Mark friend profile as seen (first time viewing BFF profile)
  rpc MarkFriendProfileAsSeen(MarkFriendProfileAsSeenReq) returns (MarkFriendProfileAsSeenRes);

  // Phase 2 — reactions → matching. Per D-09 the follow/friend RPCs above stay
  // defined (legacy data is kept read-only); writes are disabled in code by
  // plan 02-02 (return FAILED_PRECONDITION). Reactions replace follow/friend.
  rpc SendReaction(SendReactionRequest) returns (SendReactionResponse);
  rpc CancelReaction(CancelReactionRequest) returns (CancelReactionResponse);
  rpc GetReceivedReactions(GetReceivedReactionsRequest) returns (GetReceivedReactionsResponse);
  rpc GetSentReactions(GetSentReactionsRequest) returns (GetSentReactionsResponse);
  rpc GetMatches(GetMatchesRequest) returns (GetMatchesResponse);
  rpc GetReactionState(GetReactionStateRequest) returns (GetReactionStateResponse);
  rpc GetReactionStates(GetReactionStatesRequest) returns (GetReactionStatesResponse);

  // Phase 3 — aggregate unread activity count (matches + reactions + bff requests)
  // and per-user activity-tab watermark. One aggregate RPC avoids 3x BFF→social
  // round-trips (CONTEXT.md decision-for-plan).
  rpc GetUnreadActivityCount(GetUnreadActivityCountRequest) returns (GetUnreadActivityCountResponse);
  rpc MarkActivitySeen(MarkActivitySeenReq) returns (MarkActivitySeenRes);

  // Phase 5 — free-tier reaction quotas + paid reveal (REQ-02 / D-01…D-04).
  // RevealReaction spends one of the daily reveal budget and marks one
  // ReceivedReactionEntry permanently revealed for that reactor (D-03) — only
  // the daily budget resets. That flag is presentational: the reactor identity
  // is already on the wire before the reveal (see ReceivedReactionEntry).
  // GetReactionQuotas is the read-only banner query for both counters.
  rpc RevealReaction(RevealReactionRequest) returns (RevealReactionResponse);
  rpc GetReactionQuotas(GetReactionQuotasRequest) returns (GetReactionQuotasResponse);

  // Phase 6 (D-01/D-04) — an opener costs 1 of a 2/day budget and nothing from
  // the 20/day reaction budget; the reserve and the unbilled reaction commit
  // in one transaction so "unit reserved but reaction never recorded" cannot
  // happen. Only the social->message boundary needs compensation.
  rpc SendChatOpener(SendChatOpenerRequest) returns (SendChatOpenerResponse);
  // Phase 6 (D-04) — compensating release: rolls back the reserved unit when
  // the message write on the message-service side fails after the reserve
  // succeeded here.
  rpc ReleaseChatOpener(ReleaseChatOpenerRequest) returns (ReleaseChatOpenerResponse);
  // Phase 6 (D-16) — read-only banner query for the opener budget, mirroring
  // GetReactionQuotas's shape.
  rpc GetChatOpenQuotaCount(GetChatOpenQuotaCountRequest) returns (GetChatOpenQuotaCountResponse);
}

// Phase 2 — reaction state for a (account_id, target_id) pair. Mirrors the
// existing GetRelationshipByAccountId pattern; the batch GetReactionStates
// (map<string, ReactionState>) avoids N+1 for card rendering.
enum ReactionState {
  REACTION_STATE_NONE = 0;
  REACTION_STATE_SENT = 1;
  REACTION_STATE_MATCHED = 2;
}

message FollowRequest {
  string account_id = 1;
  string target_id = 2;
}

message FollowResponse {
  bool success = 1;
}

message UnfollowRequest {
  string account_id = 1;
  string target_id = 2;
}

message UnfollowResponse {
  bool success = 1;
}

message IsFollowRequest {
  string account_id = 1;
  string target_id = 2;
}

message IsFollowResponse {
  bool is_follow = 1;
}

message GetFollowersRequest {
  string account_id = 1;
  int32 page = 2;
  int32 limit = 3;
}

message GetFollowersResponse {
  repeated string follower_ids = 1;
}

message GetFollowingRequest {
  string account_id = 1;
  int32 page = 2;
  int32 limit = 3;
}

message GetFollowingResponse {
  repeated string following_ids = 1;
}

// Friend 
message GetFriendsRequest {
  string account_id = 1;
  int32 page = 2;
  int32 limit = 3;
}

message GetFriendsResponse {
  repeated string friend_ids = 1;
}

message IsFriendRequest {
  string account_id = 1;
  string target_id = 2;
}

message IsFriendResponse {
  bool is_friend = 1;
}

message AddFriendRequest {
  string account_id = 1;
  string target_id = 2;
}
message AddFriendResponse {
  bool success = 1;
}

message UnFriendRequest {
  string account_id = 1;
  string target_id = 2;
}
message UnFriendResponse {
  bool success = 1;
}

message GetFriendRequestsRequest {
  string account_id = 1;
  int32 page = 2;
  int32 limit = 3;
}
message GetFriendRequestsResponse {
  repeated string friend_request_ids = 1;
}

message AcceptFriendRequest {
  string account_id = 1;
  string target_id = 2;
}
message AcceptFriendResponse {
  bool success = 1;
}

message RejectFriendRequest {
  string account_id = 1;
  string target_id = 2;
}
message RejectFriendResponse {
  bool success = 1;
}

message GetSendFriendRequestsRequest {
  string account_id = 1;
  int32 page = 2;
  int32 limit = 3;
}
message GetSendFriendRequestsResponse {
  repeated string friend_request_ids = 1;
}

message GetAllFriendRequestsRequest {
  string account_id = 1;
  int32 page = 2;
  int32 limit = 3;
}
message GetAllFriendRequestsResponse {
  repeated string friend_request_ids = 1;
}

// Additional methods for friends
message GetRelationshipByAccountIdRequest {
  string account_id = 1;
  string target_id = 2;
}
message GetRelationshipByAccountIdResponse {
  bool is_friend = 1;
  bool is_follower = 2;
  bool is_following = 3;
  bool is_request_sent = 4;
  bool is_request_received = 5;
  int32 days_as_friend = 6;
  bool first_seen = 7;
}

message GetRelationshipByAccountIdsRequest {
  string account_id = 1;
  repeated string target_ids = 2;
}
message GetRelationshipByAccountIdsResponse {
  repeated string friend_ids = 1;
  repeated string follower_ids = 2;
  repeated string following_ids = 3;
  map<string, bool> first_seen = 4; // friend_account_id -> isFirstSeen (true = not yet seen by user)
}

message GetFollowersCountRequest {
  string account_id = 1;
}
message GetFollowersCountResponse {
  int32 count = 1;
}

// Coming
message CreateComingReq {
  string account_id = 1;
  string target_id = 2;
}

message GetComingReq {
  string account_id = 1;
  string target_id = 2;
}
message GetComingRes {
  bool is_coming = 1;
}

message DeleteComingReq {
  string account_id = 1;
  string target_id = 2;
}

message DeleteAllComingsByUserIDReq {
  string account_id = 1;
}

// Suggested Friends
message GetSuggestedFriendsReq {
  string account_id = 1;
  int32 limit = 2;
}
message SuggestedFriend{
  string account_id = 1;
  int32 mutual_friends_count = 2;
}
message GetSuggestedFriendsRes {
  repeated SuggestedFriend suggested_friends = 1;
}

// Reset Relationship Messages
message ResetRelationshipRequest {
  repeated string account_ids = 1;
}

message ResetRelationshipResponse {
  bool success = 1;
  string message = 2;
}

// Mark Friend Profile As Seen
message MarkFriendProfileAsSeenReq {
  string account_id = 1;
  string target_id = 2;
}

message MarkFriendProfileAsSeenRes {
  bool success = 1;
}

// ========== Phase 2: Reactions / Matching ==========
// One-way "interested" signal (D-05). Unlimited + revocable. A match is a
// mutual reaction (A→B AND B→A), detected at write time (D-06). Canceling a
// reaction dissolves any match it was part of (D-14).

message SendReactionRequest {
  string account_id = 1;
  string target_id = 2;
  // Phase 5 — the send-quota day. The BFF computes the user's LOCAL date and
  // passes the IANA zone name, exactly as RecordEngagementRequest already does
  // (profile.proto): the social service compares date strings and needs no tz
  // database and no clock policy of its own.
  string quota_date = 3;   // user's local date "2026-08-25"
  string timezone = 4;     // IANA name "Asia/Ho_Chi_Minh"
}
message SendReactionResponse {
  bool success = 1;
  bool matched = 2;     // true iff a mutual match was created (or already existed)
  string match_id = 3;  // populated when matched; empty otherwise
  // Phase 5 — post-send quota state so the client can render the countdown
  // banner straight off the success response, with no second round trip.
  int32 quota_limit = 4;      // today's send cap (free tier)
  int32 quota_remaining = 5;  // sends left today AFTER this one; 0 when spent
  bool quota_unlimited = 6;   // true for a subscriber — limit/remaining are meaningless
}

message CancelReactionRequest {
  string account_id = 1;
  string target_id = 2;
}
message CancelReactionResponse {
  bool success = 1;
  bool match_dissolved = 2;  // D-14 — true iff a match row was removed by this cancel
}

message GetReceivedReactionsRequest {
  string account_id = 1;
  int32 page = 2;
  int32 limit = 3;
  // peek = read the list WITHOUT advancing reactions_seen_at. Default false
  // keeps the existing "opening the list clears the badge" behaviour for the
  // FE list endpoint; the BFF's activity-badge validation pass sets it true so
  // reconciling the counts cannot clear the badge it is about to report.
  bool peek = 4;
  // Phase 5 — the reveal-quota day, on the same BFF-computes-the-local-day
  // contract as SendReactionRequest. This RPC never SPENDS a reveal, so the
  // date is only the key the daily reveal counters are read against; the
  // `is_revealed` flag itself is driven by the permanent reveal ledger and is
  // date-free.
  // An EMPTY value means "unlimited, do not count": no counter is read and
  // every entry comes back revealed. The BFF sets it from the actor's own
  // IsSubscription and is solely responsible for that call (T-05-76).
  string quota_date = 5;   // user's local date "2026-08-25"; empty = unlimited
}
// Phase 5 — BREAKING change to this response (supersedes D-04). `reactor_ids`
// (field 1) is REMOVED and reserved: the flat id list was replaced by the
// richer `entries` list plus the reveal counters, and reserving the number and
// name means no pb consumer can accidentally keep reading the old shape.
// Reserving it is a wire-shape decision ONLY and is NOT a privacy boundary —
// see ReceivedReactionEntry: reactor identity is returned for unrevealed
// entries too.
message GetReceivedReactionsResponse {
  reserved 1;
  reserved "reactor_ids";
  repeated ReceivedReactionEntry entries = 2;
  int32 reveal_limit = 3;      // today's reveal budget
  int32 reveal_remaining = 4;  // reveals left today
}

// One received reaction, revealed or not (supersedes D-04).
//
// `reactor_id` is ALWAYS populated — for unrevealed entries exactly as for
// revealed ones. `is_revealed` is a PRESENTATION flag ONLY: it tells the client
// whether to render the tile blurred. It does NOT gate what the server sends.
//
// WARNING to future readers — this is deliberate, not an oversight. Reactor
// identity IS on the wire for unrevealed entries, so the reveal paywall is
// CLIENT-ENFORCED and is bypassable by anyone who reads the HTTP response. The
// product owner accepted that tradeoff explicitly; this decision SUPERSEDES
// D-04, under which the server withheld `reactor_id` until a reveal was spent.
// Do NOT "fix" this back to server-side withholding without a new product
// decision.
//
// `reveal_limit` / `reveal_remaining` still report the daily reveal budget, and
// RevealReaction still spends it and still marks an entry permanently revealed
// (D-03) — but those counters now drive UX only, they no longer gate data.
message ReceivedReactionEntry {
  string reaction_id = 1;                     // opaque; the reveal handle
  google.protobuf.Timestamp created_at = 2;
  bool is_revealed = 3;                       // presentation only: blur the tile?
  string reactor_id = 4;                      // ALWAYS populated, revealed or not
}

message GetSentReactionsRequest {
  string account_id = 1;
  int32 page = 2;
  int32 limit = 3;
}
message GetSentReactionsResponse {
  repeated string target_ids = 1;
}

message GetMatchesRequest {
  string account_id = 1;
  int32 page = 2;
  int32 limit = 3;
  // peek = read the list WITHOUT advancing matches_seen_at. See the note on
  // GetReceivedReactionsRequest.peek.
  bool peek = 4;
}
message GetMatchesResponse {
  repeated string match_ids = 1;  // the OTHER side's account_id for each match
}

message GetReactionStateRequest {
  string account_id = 1;
  string target_id = 2;
}
message GetReactionStateResponse {
  ReactionState state = 1;
}

// Batch per-pair state query — mirrors GetRelationshipByAccountIds shape.
// Avoids N+1 gRPC for card rendering (explore list, etc.).
message GetReactionStatesRequest {
  string account_id = 1;
  repeated string target_ids = 2;
}
message GetReactionStatesResponse {
  map<string, ReactionState> states = 1;  // target_id → state
}

// ========== Phase 3: Unread Activity Badges ==========
// Aggregate activity counts for the Activity tab. One RPC returns the unread
// total + per-section breakdown PLUS the lifetime section totals, avoiding 5
// separate BFF→social COUNT calls.
// "Unread" = items newer than the account's per-section watermarks (stamped by
// MarkActivitySeen / the list-RPC side-effects when each list opens).
// "Total*" = lifetime count of that section (no watermark) for section headers.

message GetUnreadActivityCountRequest {
  string account_id = 1;
}

message GetUnreadActivityCountResponse {
  int32 unread_count = 1;      // unread matches + reactions + bff_requests
  int32 matches = 2;           // unread since the matches watermark
  int32 reactions = 3;         // unread since the reactions watermark
  int32 bff_requests = 4;      // unread since the bff watermark
  int32 total_matches = 5;     // lifetime matches (either side of the pair)
  int32 total_reactions = 6;   // lifetime active received reactions
}

message MarkActivitySeenReq {
  string account_id = 1;
}

message MarkActivitySeenRes {
  bool success = 1;
}

// ========== Phase 5: Reaction quotas + paid reveal (REQ-02 / D-01…D-04) ==========

// RevealReaction spends one reveal from the daily budget. `quota_date`/`timezone`
// follow the same BFF-computes-the-local-day contract as SendReactionRequest.
// A repeat reveal of an already-revealed reactor is free: it returns
// `already_revealed = true` and debits nothing (D-03 — a reveal is permanent).
message RevealReactionRequest {
  string account_id = 1;
  string reaction_id = 2;
  string quota_date = 3;   // user's local date "2026-08-25"
  string timezone = 4;     // IANA name "Asia/Ho_Chi_Minh"
}

message RevealReactionResponse {
  string reactor_id = 1;
  google.protobuf.Timestamp revealed_at = 2;
  bool already_revealed = 3;   // true when this reactor was already unlocked; no debit
  int32 reveal_limit = 4;
  int32 reveal_remaining = 5;
}

// Read-only banner query for both daily counters. No timezone: the caller has
// already resolved its local day into `quota_date`.
message GetReactionQuotasRequest {
  string account_id = 1;
  string quota_date = 2;   // user's local date "2026-08-25"
}

message GetReactionQuotasResponse {
  int32 send_limit = 1;
  int32 send_remaining = 2;
  int32 reveal_limit = 3;
  int32 reveal_remaining = 4;
  // Phase 6 (D-16) — additive block: the chat-opener budget rendered on the
  // same banner payload since both budgets reset on the same clock.
  int32 chat_opener_limit = 5;
  int32 chat_opener_remaining = 6;
}

// ========== Phase 6: Chat-Opener Budget (D-01..D-04) ==========
// SendChatOpener reserves 1 of the 2/day opener budget and records the same
// unbilled reaction SendReaction would, in one transaction (RESEARCH §3.1).
// An empty quota_date means "unlimited, do not count" -- the same contract
// SendReactionRequest already uses (D-03).
message SendChatOpenerRequest {
  string account_id = 1;
  string target_id = 2;
  string quota_date = 3;   // user's local date "2026-08-25"; empty = unlimited/do-not-count
  string timezone = 4;     // IANA name "Asia/Ho_Chi_Minh"
}
message SendChatOpenerResponse {
  bool success = 1;
  bool matched = 2;     // true iff a mutual match was created (or already existed)
  string match_id = 3;  // populated when matched; empty otherwise
  int32 quota_limit = 4;
  int32 quota_remaining = 5;
  bool quota_unlimited = 6;
  bool reaction_already_existed = 7; // true when the sender had already reacted to the target -- no second reaction was recorded (SC4)
  bool revealed = 8;                 // true when this call wrote the free permanent reveal row (D-12)
}

// ReleaseChatOpener is the compensating release for D-04's reserve/commit
// split: rolls back the reserved unit when the message-service write fails
// after the reserve succeeded.
message ReleaseChatOpenerRequest {
  string account_id = 1;
  string target_id = 2;
  string quota_date = 3;
}
message ReleaseChatOpenerResponse {
  bool success = 1;
  int32 count = 2;             // the post-decrement counter
  bool reaction_revoked = 3;   // false when the pair had already matched and the reaction was deliberately left intact (D-09)
}

// GetChatOpenQuotaCount is a read-only counter lookup, used internally by the
// combined SendChatOpener transaction and available standalone.
message GetChatOpenQuotaCountRequest {
  string account_id = 1;
  string quota_date = 2;
}
message GetChatOpenQuotaCountResponse {
  int32 count = 1;
}
