syntax = "proto3";

package settingpb;

option go_package = "settingpb/";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// Service Definition
service SettingService {
  // Account Settings
  rpc GetAccountSetting(GetAccountSettingRequest) returns (GetAccountSettingResponse);
  rpc UpdateSetting(UpdateSettingRequest) returns (google.protobuf.Empty);
  rpc BlockUser(BlockUserRequest) returns (google.protobuf.Empty);
  rpc UnblockUser(UnblockUserRequest) returns (google.protobuf.Empty);
  rpc CreateReport(CreateReportRequest) returns (CreateReportResponse);
  rpc GetAllReports(GetAllReportsRequest) returns (GetAllReportsResponse);
  rpc GetReportById(GetReportByIdRequest) returns (GetReportByIdResponse);
  rpc DeleteReport(DeleteReportRequest) returns (google.protobuf.Empty);
  rpc UpdateReport(UpdateReportRequest) returns (google.protobuf.Empty);

  // Phase 5 — batched account-settings read (folded todo
  // 2026-08-18-batched-setting-rpc-for-block-checks). Collapses the per-account
  // GetAccountSetting fan-out in the BFF's explore block-filter and glow
  // hydration to ONE call. NOTE: a new SettingService RPC must also be delegated
  // in the combined server, not just the RPC struct, or the live service returns
  // Unimplemented.
  rpc GetAccountSettings(GetAccountSettingsRequest) returns (GetAccountSettingsResponse);

  // Phase 5 — server-owned special-glow activation (REQ-03). Deliberately NOT
  // the client-writable UpdateSetting glow oneof: the BFF needs a way to light
  // SPECIAL glow that a client cannot drive directly. Duration is server-fixed
  // at 90 minutes (1 boost = 90 min, deck slide 4) and the request carries NO
  // duration field precisely so a client cannot mint glow time. Repeat calls
  // STACK additively: an already-burning special glow is extended by 90 minutes
  // from its current expiry rather than reset to now+90m.
  rpc ActivateSpecialGlow(ActivateSpecialGlowRequest) returns (ActivateSpecialGlowResponse);

  // SetSpecialGlow SUPERSEDES ActivateSpecialGlow (REQ-03, boost lifecycle).
  //
  // The payment service now owns the boost clock, so the duration is no longer
  // this service's to compute: the caller supplies the absolute end time it
  // already calculated from the running unit plus everything queued behind it.
  // This service just persists the projection.
  //
  // It is NOT additive -- it ASSIGNS. Stacking is resolved upstream where the
  // discrete units live; adding here as well would double-count. A request with
  // state "off" (or an unset glow_ends_at) CLEARS the special pair, which is
  // what a pause and a fully-settled boost both need and what
  // ActivateSpecialGlow could never express.
  rpc SetSpecialGlow(SetSpecialGlowRequest) returns (SetSpecialGlowResponse);

  // BFF Notification Settings
  rpc GetNotificationBffSetting(GetNotificationBffSettingRequest) returns (NotificationBffSetting);
  rpc UpdateNotificationBffSetting(UpdateNotificationBffSettingRequest) returns (google.protobuf.Empty);

  // Ghost Mode Settings
  rpc GetGhostModeSettingsForBFF(GetGhostModeSettingsForBFFRequest) returns (GetGhostModeSettingsForBFFResponse);

  // SOS Settings
  rpc GetUserSOSSetting(GetUserSOSSettingRequest) returns (GetUserSOSSettingResponse);
  rpc CreateSOSRequest(CreateSOSRequestRequest) returns (SOSRequest);
  rpc RespondToSOSRequest(RespondToSOSRequestRequest) returns (SOSRequest);
  rpc GetSOSRequests(GetSOSRequestsRequest) returns (GetSOSRequestsResponse);
  rpc DeleteSOSRequest(DeleteSOSRequestRequest) returns (google.protobuf.Empty);
  rpc GetSOSRequest(GetSOSRequestRequest) returns (SOSRequest);
}

// Privacy Setting
message PrivacySetting {
  string id = 1;
  string account_id = 2;
  string world_visibility = 3;      // Who can see my world? (Everyone, BFFs, Only me)
  string location_visibility = 4;    // Who can see my locations?
  string checkin_visibility = 5;     // Who can see my check-in log?
  string message_permission = 6;     // Who can message me?
  bool show_in_people_who_may_know = 7;
  repeated string blacklisted_users = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  bool auto_detect_visited_places = 11;
}

// System Setting represents user preferences for system-wide settings
message SystemSetting {
  // Basic fields
  string id = 1;
  string account_id = 2;

  // Language and units
  string language = 3;          // Language code (e.g., "en_US", "en_UK", "es", "de", "fr", "zh_CN", "ja", "vi", "ko", "pt")
  string distance_units = 4;    // Distance unit ("miles" or "km")
  
  // Map settings
  string map_style = 5;         // Map style ("auto", "light", "dark")
  bool heatmap_enabled = 6;     // Toggle for heatmap visualization
  bool weather_enabled = 7;     // Toggle for weather overlay
  
  // Metadata
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

// Notification Setting
message NotificationSetting {
  string id = 1;
  string account_id = 2;
  bool new_city = 3;           // When you visit a new city
  bool checkin_reminder = 4;   // To check-in to the location you are visiting
  bool new_follower = 5;       // When someone follows you
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

// BFF Notification Setting
message NotificationBffSetting {
  string id = 1;
  string account_id = 2;
  string bff_account_id = 3;
  bool all_notifications = 4;  // Master toggle for all notifications from this BFF
  bool new_country = 5;       // When BFF travels to a new country
  bool city_arrival = 6;      // When BFF arrives in a city
  bool near_me = 7;           // When BFF comes within 1km
  bool new_checkin = 8;       // When BFF checks in (I receive notification)
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  bool share_my_checkin = 11;  // When I check in, notify this BFF
}

// Ghost Mode Settings
enum LocationVisibilityType {
  VISIBILITY_TYPE_UNSPECIFIED = 0;
  VISIBILITY_TYPE_PRECISE = 1;    // Accurate location in real time
  VISIBILITY_TYPE_BLURRED = 2;    // Approximate location in real time
  VISIBILITY_TYPE_FIXED = 3;      // Last known location, no updates
  VISIBILITY_TYPE_HIDDEN = 4;     // Location completely hidden
}


message GhostModeSetting {
  string bff_account_id = 1;
  string duration = 2;
  LocationVisibilityType visibility_type = 3;
  // Fixed location coordinates (only used when visibility_type = VISIBILITY_TYPE_FIXED)
  double fixed_lat = 4;
  double fixed_lng = 5;
  // Timestamp when the fixed location was set
  google.protobuf.Timestamp fixed_timestamp = 6;
}

// Meetup Setting
message MeetupSetting {
  bool visibility = 1;
  string duration = 2;
  string expiration = 3;
}

// Glow Setting — explore-card glow badge + 2h/8h countdown timer (D-04 / W1).
// Glow is an EXPLORE concept (not meetup): explore is now always-on with its
// own discoverability opt-out, so glow lives in its own setting/table rather
// than being bolted onto MeetupSetting. glow_state ∈ {off, forever, 2h, 8h};
// glow_expires_at is null/zero when glow_state is off/forever (no expiry), and
// computed (now+2h/8h) for the time-boxed states.
//
// Phase 5 — BASE / SPECIAL glow split (REQ-03). Fields 1-2 remain the
// pre-existing BASE glow timer and are NEVER written by a boost. Fields 3-5 are
// additive:
//   * glow_enabled       — the authoritative base on/off boolean (two-tier-glow
//                          todo). Independent of the base timer state.
//   * special_glow_state — off | 90m. Written ONLY by boost activation
//                          (ActivateSpecialGlow), never by the client-writable
//                          UpdateSetting glow oneof.
//   * special_glow_expires_at — decays resolve-on-read: masked when in the past,
//                          never written back, no cron and no sweeper. Because
//                          nothing writes back, a persisted expiry may be
//                          past-but-non-zero — stacking must compare against
//                          time.Now() on the RAW row, not the decayed read model.
message GlowSetting {
  string glow_state = 1;                        // off | forever | 2h | 8h (deck slide 10) — BASE timer
  google.protobuf.Timestamp glow_expires_at = 2;  // null/zero when glow_state is off/forever — BASE
  bool glow_enabled = 3;                        // BASE glow on/off (authoritative boolean)
  string special_glow_state = 4;                // off | 90m — boost-owned, server-written only
  google.protobuf.Timestamp special_glow_expires_at = 5;  // resolve-on-read decay; zero when off
}

// Combined Settings
message AccountSettings {
  PrivacySetting privacy = 1;
  SystemSetting system = 2;
  NotificationSetting notification = 3;
  MeetupSetting meetup = 4;
  repeated GhostModeSetting ghost_mode = 5;
  UserSOSSetting sos_setting = 6;
  GlowSetting glow = 7;
}

// Request/Response Messages
message GetAccountSettingRequest {
  string account_id = 1;
  repeated string types = 2;  // Filter by setting types
}

message GetAccountSettingResponse {
  AccountSettings settings = 1;
}

// Phase 5 — batched form of the pair above (folded todo). Keyed account_id →
// settings, mirroring social.proto's GetReactionStatesResponse map shape.
// AccountSettings is PLURAL — the todo's `AccountSetting` singular is a typo and
// no such message exists.
message GetAccountSettingsRequest {
  repeated string account_ids = 1;
  repeated string types = 2;  // Filter by setting types (same semantics as the singular RPC)
}

message GetAccountSettingsResponse {
  map<string, AccountSettings> settings = 1;  // account_id → settings
}

// Phase 5 — special-glow activation (REQ-03). No duration field by design: the
// 90-minute grant is server-fixed so a client cannot mint glow time. Repeat
// calls stack additively from the current expiry.
message ActivateSpecialGlowRequest {
  string account_id = 1;
}

message ActivateSpecialGlowResponse {
  string special_glow_state = 1;                          // "90m" on success
  google.protobuf.Timestamp special_glow_expires_at = 2;  // post-stack expiry
}

// SetSpecialGlow ASSIGNS the special pair from a projection the caller already
// computed. state is one of off | 8h | paused:
//   - "8h"     -> glowing until glow_ends_at (which MUST be set)
//   - "paused" -> banked, not burning; the pair is cleared so the card stops
//                 glowing, and the remaining time lives in the payment service
//   - "off"    -> cleared outright (no units left, or a settled boost)
message SetSpecialGlowRequest {
  string account_id = 1;
  string state = 2;
  google.protobuf.Timestamp glow_ends_at = 3;
}

message SetSpecialGlowResponse {
  string special_glow_state = 1;
  google.protobuf.Timestamp special_glow_expires_at = 2;
}

message GetNotificationBffSettingRequest {
  string account_id = 1;
  string bff_account_id = 2;
}

message GetNotificationBffSettingsResponse {
  repeated NotificationBffSetting settings = 1;
}

message UpdateNotificationBffSettingRequest {
  string account_id = 1;
  NotificationBffSetting setting = 2;
}

message UpdateSettingRequest {
  string account_id = 1;
  oneof setting {
    PrivacySetting privacy = 2;
    SystemSetting system = 3;
    NotificationSetting notification = 4;
    UpdateGhostModeSetting ghost_mode = 5;
    MeetupSetting meetup = 6;
    UserSOSSetting sos_setting = 7;
    GlowSetting glow = 8;
  }
}

message UpdateGhostModeSetting {
  repeated string bff_account_ids = 1;
  string duration = 2;
  LocationVisibilityType visibility_type = 3;
  // Fixed location coordinates (only used when visibility_type = VISIBILITY_TYPE_FIXED)
  double fixed_lat = 4;
  double fixed_lng = 5;
  // Timestamp when the fixed location was set
  google.protobuf.Timestamp fixed_timestamp = 6;
}

// New request message for BlockUser RPC
message BlockUserRequest {
  string account_id = 1;        // The account ID of the user performing the block
  string user_to_block_id = 2;  // The account ID of the user to be blocked
}

// New request message for UnblockUser RPC
message UnblockUserRequest {
  string account_id = 1;          // The account ID of the user performing the unblock
  string user_to_unblock_id = 2;  // The account ID of the user to be unblocked
}

// Report message
message Report {
  string id = 1;
  string account_id = 2;
  string report_type = 3;
  string content = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  string reported_account_id = 7;
  string status = 8;
  string note = 9;
}

message CreateReportRequest {
  string account_id = 1;
  string report_type = 2;
  string content = 3;
  string reported_account_id = 4;
}

message CreateReportResponse {
  Report report = 1;
}

// Get all reports request and response
message GetAllReportsRequest {
  int32 page = 1;
  int32 limit = 2;
  string report_type = 3;
  string start_date = 4;
  string end_date = 5;
  string sort_by = 6;
  string sort_order = 7;
  string search_reporter = 8;
  string search_reported = 9;
  string status = 10;
}

message GetAllReportsResponse {
  repeated Report reports = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
  int32 total_pages = 5;
}

// Get report by ID request and response
message GetReportByIdRequest {
  string report_id = 1;
}

message GetReportByIdResponse {
  Report report = 1;
}

// Delete report request
message DeleteReportRequest {
  string report_id = 1;
}

// Update report request
message UpdateReportRequest {
  string report_id = 1;
  string status = 2;
  string note = 3;
}

// SOS Setting
message SOSRequest {
  string id = 1;
  string requester_id = 2; // The one who requests
  string responder_id = 3; // The one who is requested
  string status = 4;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// SOS Setting RPC Messages
message CreateSOSRequestRequest {
  string account_id = 1; // The one who requests
  string friend_id = 2;  // The one who is requested
}

message RespondToSOSRequestRequest {
  string account_id = 1; // The one responding
  string request_id = 2; // The ID of the SOSSetting request
  string status = 3; // "accepted" or "rejected"
}

message GetSOSRequestsRequest {
  string account_id = 1;
}

message GetSOSRequestsResponse {
  repeated SOSRequest sos_requests = 1;
}

message DeleteSOSRequestRequest {
  string account_id = 1;
  string sos_request_id = 2;
}

message GetSOSRequestRequest {
  string request_id = 1;
}

// User's own SOS settings
message UserSOSSetting {
  string id = 1;
  string account_id = 2;
  bool add_button_sos_to_map = 3; // Default true, Tap to hide/show SOS button on the map
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message GetUserSOSSettingRequest {
  string account_id = 1;
}

message GetUserSOSSettingResponse {
  UserSOSSetting sos_setting = 1;
  repeated SOSRequest sos_requests = 2;
}

// Ghost Mode Settings for BFF
message GetGhostModeSettingsForBFFRequest {
  string bff_account_id = 1;
}

message GetGhostModeSettingsForBFFResponse {
  repeated GhostModeSettingInfo settings = 1;
}

message GhostModeSettingInfo {
  string account_id = 1;       // Who set the ghost mode
  string visibility_type = 2;  // blurred/hidden/fixed/precise
  string expires_at = 3;        // Expiration timestamp
  // Fixed location coordinates (only used when visibility_type = "fixed")
  double fixed_lat = 4;
  double fixed_lng = 5;
  // Timestamp when the fixed location was set
  google.protobuf.Timestamp fixed_timestamp = 6;
}
