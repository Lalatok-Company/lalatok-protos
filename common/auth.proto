syntax = "proto3";

package auth;

// This is the Go package name
option go_package = "authpb/";


message Account {
  string id = 1;
  string phone = 2;
  repeated AccountSocial account_socials = 3;
}

message AccountSocial {
    string provider = 1;
    string email = 2;
    bool is_mail_verified = 3;
    bool is_private_email = 4;
}

// Auth service
service AuthService {
    rpc Login (LoginRequest) returns (LoginResponse);
    rpc LoginByPhone (LoginByPhoneRequest) returns (LoginResponse);
    rpc Register (RegisterRequest) returns (RegisterResponse);
    rpc RefreshToken (RefreshTokenRequest) returns (RefreshTokenResponse);
    rpc ValidateToken (ValidateTokenRequest) returns (ValidateTokenResponse);
    rpc CheckPhoneExists (CheckPhoneExistsRequest) returns (CheckPhoneExistsResponse);
    rpc GetAccountsByPhone (GetAccountsByPhoneRequest) returns (GetAccountsByPhoneResponse);
    rpc GetAccountsByIds (GetAccountsByIdsRequest) returns (GetAccountsByIdsResponse);
    rpc DeleteAccount (DeleteAccountRequest) returns (DeleteAccountResponse);
    rpc GetMyAccount (GetMyAccountRequest) returns (GetMyAccountResponse);
    rpc LoginAdmin (LoginAdminRequest) returns (LoginAdminResponse);
    rpc GetAdminInfo (GetAdminInfoRequest) returns (GetAdminInfoResponse);
    rpc ChangeAdminPassword (ChangeAdminPasswordRequest) returns (ChangeAdminPasswordResponse);
    rpc LoginSocial (LoginSocialRequest) returns (LoginSocialResponse);
    rpc LinkSocial (LinkSocialRequest) returns (LinkSocialResponse);
    rpc RegisterAdmin (RegisterAdminRequest) returns (RegisterAdminResponse);
    // Records one delivered OTP; idempotent on send_id
    rpc RecordOtpSend (RecordOtpSendRequest) returns (RecordOtpSendResponse);
    // Records what happened to a delivered OTP (used, wrong code, burned)
    rpc RecordOtpOutcome (RecordOtpOutcomeRequest) returns (RecordOtpOutcomeResponse);
    // Read-only OTP audit log for the admin page
    rpc ListOtpLogs (ListOtpLogsRequest) returns (ListOtpLogsResponse);
    // Daily and total OTP send and use counts for the admin page
    rpc GetOtpLogStats (GetOtpLogStatsRequest) returns (GetOtpLogStatsResponse);
}

// Login request and response
message LoginRequest {
    string phone = 1;
    string password = 2;
}

message LoginResponse {
    string access_token = 1;
    string ws_token = 2;
    string refresh_token = 3;
    int32 expires_in = 4;
}

// Login by Phone request
message LoginByPhoneRequest {
    string phone = 1;
}

// Register request and response
message RegisterRequest {
    string phone = 1;
    string password = 2;
    string ref_by = 3;
}

message RegisterResponse {
    string access_token = 1;
    string ws_token = 2;
    string refresh_token = 3;
    int32 expires_in = 4;
}

// Refresh token request and response
message RefreshTokenRequest {
    string refresh_token = 1;
}

message RefreshTokenResponse {
    string access_token = 1;
    string ws_token = 2;
    int32 expires_in = 3;
    string refresh_token = 4;
}

// Validate token request and response
message ValidateTokenRequest {
    string access_token = 1;
}

message ValidateTokenResponse {
    bool is_valid = 1;
    string user_id = 2;
}

// Check phone exists request and response
message CheckPhoneExistsRequest {
    string phone = 1;
}

message CheckPhoneExistsResponse {
    bool exists = 1;
}

// Get user by phone numbers request and response
message GetAccountsByPhoneRequest {
    repeated string phone_numbers = 1;
}

message GetAccountsByPhoneResponse {
    repeated Account accounts = 1;
}

// Get accounts by IDs request and response
message GetAccountsByIdsRequest {
    repeated string account_ids = 1;
}

message GetAccountsByIdsResponse {
    repeated Account accounts = 1;
}

// Delete account request and response
message DeleteAccountRequest {
    string account_id = 1;
}

message DeleteAccountResponse {
    bool success = 1;
}

// Get my account request and response
message GetMyAccountRequest {
    string account_id = 1;
}

message GetMyAccountResponse {
    string id = 1;
    string phone = 2;
}

// Admin login request and response
message LoginAdminRequest {
    string username = 1;
    string password = 2;
}

message LoginAdminResponse {
    string access_token = 1;
    string ws_token = 2;
    string refresh_token = 3;
    int32 expires_in = 4;
    string role = 5;
}

// Get admin info request and response
message GetAdminInfoRequest {
    string admin_id = 1;
}

message GetAdminInfoResponse {
    string id = 1;
    string username = 2;
    string role = 3;
    bool is_active = 4;
}

// Change admin password request and response
message ChangeAdminPasswordRequest {
    string admin_id = 1;
    string old_password = 2;
    string new_password = 3;
}

message ChangeAdminPasswordResponse {
    bool success = 1;
    string message = 2;
}

// Login social request and response
message LoginSocialRequest {
    string provider = 1;
    string access_token = 2;
    string platform = 3;
}

message LoginSocialResponse {
    string access_token = 1;
    string ws_token = 2;
    string refresh_token = 3;
    int32 expires_in = 4;
}

// Link social request and response
message LinkSocialRequest {
    string provider = 1;
    string access_token = 2;
    string account_id = 3;
    string platform = 4;
}

message LinkSocialResponse {
    bool success = 1;
}

// Register admin request and response
message RegisterAdminRequest {
    string username = 1;
    string password = 2;
    string role = 3;
    bool is_active = 4;
}

message RegisterAdminResponse {
    Admin admin = 1;
}

message Admin {
    string id = 1;
    string username = 2;
    string role = 3;
    bool is_active = 4;
}

// What happened to a delivered OTP
enum OtpOutcome {
    OTP_OUTCOME_UNSPECIFIED = 0;
    OTP_OUTCOME_USED = 1;
    OTP_OUTCOME_WRONG_CODE = 2;
    OTP_OUTCOME_LOCKED = 3;
}

// One delivered OTP. The code itself is never recorded.
message RecordOtpSendRequest {
    string send_id = 1;
    string phone = 2;
    string provider = 3;
    string channel = 4;
    string trigger = 5;
    bool is_test = 6;
    bool code_check_skipped = 7;
    string ip = 8;
    int64 sent_at_ms = 9;
    int64 expires_at_ms = 10;
}

// created is false when the send id was already recorded
message RecordOtpSendResponse {
    bool created = 1;
}

message RecordOtpOutcomeRequest {
    string send_id = 1;
    OtpOutcome outcome = 2;
    int32 wrong_attempts = 3;
    int64 at_ms = 4;
    string account_id = 5;
    optional bool is_new_account = 6;
}

// updated is false when no row has that send id
message RecordOtpOutcomeResponse {
    bool updated = 1;
}

// One OTP log row. Times are RFC3339 UTC strings; used_at and account_id are empty when unknown.
// status is one of used, expired, replaced or pending. locked is true when the code was burned
// by wrong attempts.
message OtpLog {
    string id = 1;
    string phone = 2;
    string account_id = 3;
    optional bool is_new_account = 4;
    string provider = 5;
    string channel = 6;
    string trigger = 7;
    bool is_test = 8;
    bool code_check_skipped = 9;
    string ip = 10;
    string sent_at = 11;
    string expires_at = 12;
    string used_at = 13;
    string status = 14;
    bool locked = 15;
    int32 wrong_attempts = 16;
}

// phone is an exact E.164 match; phone_digits is a digits-only contains match used when phone is
// empty. Dates are YYYY-MM-DD Vietnam calendar days, inclusive.
message ListOtpLogsRequest {
    int32 page = 1;
    int32 limit = 2;
    string phone = 3;
    string phone_digits = 4;
    string status = 5;
    string start_date = 6;
    string end_date = 7;
    bool include_test = 8;
    string account_id = 9;
}

message ListOtpLogsResponse {
    repeated OtpLog logs = 1;
    int64 total = 2;
    int32 page = 3;
    int32 limit = 4;
}

// Dates are YYYY-MM-DD Vietnam calendar days, inclusive.
message GetOtpLogStatsRequest {
    string start_date = 1;
    string end_date = 2;
    bool include_test = 3;
}

message OtpLogSummary {
    int64 sent = 1;
    int64 used = 2;
    double success_rate = 3;
    int64 expired_unused = 4;
    int64 expired = 5;
    int64 replaced = 6;
    int64 pending = 7;
    int64 code_check_skipped = 8;
}

message OtpLogDailyStat {
    string date = 1;
    int64 sent = 2;
    int64 used = 3;
    double success_rate = 4;
}

message GetOtpLogStatsResponse {
    OtpLogSummary summary = 1;
    repeated OtpLogDailyStat daily = 2;
}