syntax = "proto3";

package payment;

option go_package = "paymentpb/";

import "google/protobuf/timestamp.proto";

// ========== ENUMS ==========

enum AppType {
  APP_TYPE_UNKNOWN = 0;
  APP_TYPE_IOS = 1;
  APP_TYPE_ANDROID = 2;
}

enum PaymentProvider {
  PAYMENT_PROVIDER_UNKNOWN = 0;
  PAYMENT_PROVIDER_APPLE = 1;
  PAYMENT_PROVIDER_GOOGLE = 2;
}

enum SubscriptionStatus {
  SUBSCRIPTION_STATUS_UNKNOWN = 0;
  ACTIVE = 1;
  EXPIRED = 2;
  IN_GRACE_PERIOD = 3;
  ON_HOLD = 4;
  PAUSED = 5;
  CANCELED = 6;
  REVOKED = 7;
}

// ========== SERVICE ==========

service PaymentService {
  // CompletePurchase is called by the client after a user completes an in-app purchase.
  rpc CompletePurchase(CompletePurchaseRequest) returns (CompletePurchaseResponse);

  // GetPaymentHistory retrieves the transaction history for a user.
  rpc GetPaymentHistory(GetPaymentHistoryRequest) returns (GetPaymentHistoryResponse);

  // GetUserSubscriptions retrieves the current subscriptions for a user.
  rpc GetUserSubscriptions(GetUserSubscriptionsRequest) returns (GetUserSubscriptionsResponse);

  // GetAllActiveSubscriptions retrieves all currently active subscriptions for expiry checking.
  rpc GetAllActiveSubscriptions(GetAllActiveSubscriptionsRequest) returns (GetAllActiveSubscriptionsResponse);

  // AppleServerNotification is the endpoint for Apple App Store server-to-server notifications.
  rpc AppleServerNotification(AppleServerNotificationRequest) returns (AppleServerNotificationResponse);

  // GoogleServerNotification is the endpoint for Google Play server-to-server notifications.
  rpc GoogleServerNotification(GoogleServerNotificationRequest) returns (GoogleServerNotificationResponse);

  // UseItem deducts 1 item from the user's account_items balance.
  rpc UseItem(UseItemRequest) returns (UseItemResponse);

  // GetAccountItems retrieves the account items (e.g., boost balance) for a user.
  rpc GetAccountItems(GetAccountItemsRequest) returns (GetAccountItemsResponse);

  // Boost lifecycle (REQ-03). A boost is a STATEFUL 8-hour unit, not an
  // instant spend: the quantity in account_items drops only when a unit's
  // timer actually runs out, so activating one never reduces what the user
  // sees they own. Units are DISCRETE -- activating a second boost queues it
  // behind the first rather than merging into one longer run.
  //
  // The payment service owns the clock as well as the quantity, so settling an
  // expiry ("mark consumed AND decrement") is one local transaction with no
  // cross-service race. The setting service's special-glow columns are a
  // PROJECTION of what these RPCs return, written by the caller.
  rpc ActivateBoost(ActivateBoostRequest) returns (BoostStateResponse);
  rpc PauseBoost(PauseBoostRequest) returns (BoostStateResponse);
  rpc ResumeBoost(ResumeBoostRequest) returns (BoostStateResponse);
  rpc GetBoostState(GetBoostStateRequest) returns (BoostStateResponse);

  // SettleExpiredBoosts is the sweep behind the "decrement on expiry" rule. It
  // marks every activation whose expires_at has passed as consumed, decrements
  // its account_items quantity, and promotes that account's next queued unit to
  // running. It returns the affected accounts so the caller can re-project the
  // special glow for each. Idempotent: a second run settles nothing.
  rpc SettleExpiredBoosts(SettleExpiredBoostsRequest) returns (SettleExpiredBoostsResponse);
  // Active subscribers, overdue renewals and daily verification failures for the admin dashboard
  rpc GetAdminPaymentMetrics(GetAdminPaymentMetricsRequest) returns (GetAdminPaymentMetricsResponse);
  // Read-only page of subscription records for the admin subscriptions page
  rpc ListAdminSubscriptions(ListAdminSubscriptionsRequest) returns (ListAdminSubscriptionsResponse);
  // Subscription counts by state for the admin subscriptions page
  rpc GetAdminSubscriptionSummary(GetAdminSubscriptionSummaryRequest) returns (GetAdminSubscriptionSummaryResponse);
  // One subscription record and its payment events, read-only
  rpc ListAdminSubscriptionTransactions(ListAdminSubscriptionTransactionsRequest) returns (ListAdminSubscriptionTransactionsResponse);
}

// ========== MESSAGES ==========

// --- CompletePurchase ---
message IOSPurchaseInfo {
  string transaction_receipt = 1; // JWS token from the client for iOS
}

message AndroidPurchaseInfo {
  string product_id = 1;
  string purchase_token = 2;
  string package_name = 3;
}

message CompletePurchaseRequest {
  AppType app_type = 1;
  string account_id = 2;
  oneof purchase_info {
    IOSPurchaseInfo ios_purchase = 3;
    AndroidPurchaseInfo android_purchase = 4;
  }
}

message CompletePurchaseResponse {
  SubscriptionItem subscription = 1;
  // Phase 5 — consumable (boost pack) purchases. `subscription` is UNSET for a
  // consumable; `is_consumable` tells the caller which shape it got, and
  // `boost_balance` reports the post-credit balance so one consumable purchase
  // needs no second round trip to render the new count.
  int32 boost_balance = 2;
  bool is_consumable = 3;
  repeated AccountItemProto items = 4;
}

// --- GetPaymentHistory ---
message GetPaymentHistoryRequest {
  string account_id = 1;
  int32 page = 2;
  int32 limit = 3;
}

message PaymentHistoryItem {
  string id = 1;
  int32 amount = 2;
  string provider_name = 3;
  string provider_transaction_id = 4;
  string status = 5;
  string product_id = 6;
  google.protobuf.Timestamp created_at = 7;
  // event_kind distinguishes the lifecycle event this row records: "purchase", "renew",
  // "refund", "revoke".
  string event_kind = 8;
  // price_micros is micros of the currency unit as reported by Google androidpublisher v1
  // PriceAmountMicros. Apple's JWS "price" field is milliunits and must be multiplied by
  // 1000 by the producer before it lands here. Absent means the store did not report a
  // price, not zero.
  optional int64 price_micros = 9;
  // currency is the ISO 4217 currency code.
  optional string currency = 10;
  google.protobuf.Timestamp period_start = 11;
  google.protobuf.Timestamp period_end = 12;
}

message GetPaymentHistoryResponse {
  repeated PaymentHistoryItem items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
}

// --- GetUserSubscriptions ---
message GetUserSubscriptionsRequest {
  string account_id = 1;
  bool active_only = 2;
}

message SubscriptionItem {
  string id = 1;
  string product_id = 2;
  PaymentProvider provider = 3;
  google.protobuf.Timestamp start_date = 4;
  google.protobuf.Timestamp end_date = 5;
  bool is_cancelled = 6;
  string environment = 7;
  SubscriptionStatus status = 8;
  // Renewal information fields
  int32 auto_renew_status = 9;           // 0 = off, 1 = on
  google.protobuf.Timestamp next_renewal_date = 10;
  google.protobuf.Timestamp grace_period_end_date = 11;
  bool is_in_billing_retry_period = 12;
  int32 expiration_intent = 13;
  google.protobuf.Timestamp recent_subscription_date = 14;
  string account_id = 15;
}

message GetUserSubscriptionsResponse {
  repeated SubscriptionItem subscriptions = 1;
  string subscription = 2;
}

// --- Apple Notifications ---
message AppleServerNotificationRequest {
  string signed_payload = 1;
}

message AppleServerNotificationResponse {
  bool success = 1;
}

// --- Google Notifications ---
// Represents the `message` part of a Pub/Sub push notification.
message GoogleNotificationMessage {
    string data = 1; // This is a base64-encoded string containing the actual notification JSON
    string message_id = 2;
    google.protobuf.Timestamp publish_time = 3;
}

// Represents the overall structure of a Google Pub/Sub push request.
message GoogleServerNotificationRequest {
    GoogleNotificationMessage message = 1;
    string subscription = 2;
}

message GoogleServerNotificationResponse {
    bool success = 1;
}

// --- GetAllActiveSubscriptions ---
message GetAllActiveSubscriptionsRequest {
  int32 page = 1;
  int32 limit = 2;
}

message GetAllActiveSubscriptionsResponse {
  repeated SubscriptionItem subscriptions = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
}

// --- Account Items & Boost Item ---
message AccountItemProto {
  string id = 1;
  string account_id = 2;
  string item_type = 3;
  // quantity is the TOTAL the account owns, including units currently running
  // or paused. It drops only when a unit is fully consumed (its timer ran out),
  // never at activation -- so a user with 3 boosts who starts one still reads 3.
  int32 quantity = 4;

  // Additive lifecycle detail (REQ-03). Populated for consumable item types that
  // have a running timer (today: "boost"); left zero for plain items.
  int32 in_use = 5;                              // units in state active|queued|paused
  int32 available = 6;                           // quantity - in_use: units not yet started
  string state = 7;                              // off | running | paused
  google.protobuf.Timestamp active_expires_at = 8; // when the RUNNING unit ends; unset when off/paused
  int32 remaining_seconds = 9;                   // time banked on a PAUSED unit; 0 otherwise
}

message UseItemRequest {
  string account_id = 1;
  string item_type = 2;
  int32 quantity = 3;
}

message UseItemResponse {
  bool success = 1;
  int32 remaining_quantity = 2;
}

message GetAccountItemsRequest {
  string account_id = 1;
}

message GetAccountItemsResponse {
  repeated AccountItemProto items = 1;
}

// ========== Boost lifecycle (REQ-03) ==========

// BoostStateResponse is the single shape every lifecycle RPC answers with, so
// a caller never has to stitch together two reads to know what to project onto
// the special glow.
message BoostStateResponse {
  string state = 1;                              // off | running | paused
  google.protobuf.Timestamp expires_at = 2;      // end of the RUNNING unit; unset when off/paused
  int32 remaining_seconds = 3;                   // banked time on a PAUSED unit; 0 otherwise
  int32 quantity = 4;                            // TOTAL owned, unchanged by activation
  int32 in_use = 5;                              // units active|queued|paused
  int32 available = 6;                           // units not yet started
  int32 queued = 7;                              // units waiting behind the running one

  // glow_ends_at is when the LAST queued unit finishes -- running expiry plus
  // every queued unit's duration. This is what the special glow should be set
  // to, NOT expires_at: a user with two boosts queued is glowing continuously
  // for 16 hours, not 8.
  google.protobuf.Timestamp glow_ends_at = 8;
}

message ActivateBoostRequest {
  string account_id = 1;
}

message PauseBoostRequest {
  string account_id = 1;
}

message ResumeBoostRequest {
  string account_id = 1;
}

message GetBoostStateRequest {
  string account_id = 1;
}

message SettleExpiredBoostsRequest {
  // limit caps how many activations one sweep settles; 0 means the server
  // default. Bounded so a backlog cannot turn one tick into a long transaction.
  int32 limit = 1;
}

// SettledBoost reports one account whose boost state changed during the sweep,
// carrying the POST-settlement projection so the caller can write the special
// glow without a follow-up read.
message SettledBoost {
  string account_id = 1;
  BoostStateResponse state = 2;
}

message SettleExpiredBoostsResponse {
  repeated SettledBoost settled = 1;
}

// Dates are YYYY-MM-DD Vietnam calendar days. Rows owned by exclude_account_ids are left out.
message GetAdminPaymentMetricsRequest {
  string start_date = 1;
  string end_date = 2;
  int32 list_limit = 3;
  repeated string exclude_account_ids = 4;
}

message AdminOverdueRenewal {
  string user_id = 1;
  string product_id = 2;
  string app = 3;
  string end_date = 4; // RFC3339
  string environment = 5;
}

message AdminPaymentDailyCount {
  string date = 1;
  int64 count = 2;
}

// failed_verifications counts verification failures recorded in the payment log per Vietnam day
// and never carries the log text.
//
// active_subscription_user_ids leaves out sandbox, Xcode and local-testing purchases, so it counts
// paying members only. active_any_env_user_ids applies the same active rule in every store
// environment, sandbox included: it is the list to compare premium flags against, because the
// purchase flow flags a profile premium for a sandbox purchase too. Both lists drop fake
// purchases and exclude_account_ids.
message PaymentStatusBucket {
  string key = 1;
  int64 count = 2;
}

message GetAdminPaymentMetricsResponse {
  repeated string active_subscription_user_ids = 1;
  repeated AdminOverdueRenewal overdue_renewals = 2;
  int64 overdue_renewals_total = 3;
  repeated AdminPaymentDailyCount failed_verifications = 4;
  int64 failed_verifications_total = 5;
  repeated string active_any_env_user_ids = 6;
  // Subscription records created in the range per status, real purchases only.
  repeated PaymentStatusBucket subscriptions_by_status = 7;
  // The full overdue user list behind overdue_renewals_total.
  repeated string overdue_user_ids = 8;
}

// page_size is 1 to 50. statuses take active, grace, billing_retry, expired, cancelled. platform
// takes ios or android. auto_renew takes on or off; empty lists both. environment takes
// production (default), sandbox or all. expires_from and expires_to are YYYY-MM-DD Vietnam days.
// stale_only keeps records still counted active after their end date. Fake purchases and records
// owned by exclude_user_ids are left out.
message ListAdminSubscriptionsRequest {
  int32 page = 1;
  int32 page_size = 2;
  repeated string user_ids = 3;
  string transaction_id = 4;
  repeated string statuses = 5;
  string platform = 6;
  repeated string product_ids = 7;
  string auto_renew = 8;
  string environment = 9;
  string expires_from = 10;
  string expires_to = 11;
  bool stale_only = 12;
  repeated string exclude_user_ids = 13;
}

// Dates are RFC3339. status is derived: grace while the grace period runs, billing_retry while
// the store retries billing, active when not cancelled and the end date has not passed,
// cancelled when cancelled, else expired. events counts the payment events for the same user and
// product.
message AdminSubscriptionRow {
  int64 id = 1;
  string user_id = 2;
  string app = 3;
  string product_id = 4;
  string orig_tx_id = 5;
  string status = 6;
  bool auto_renew = 7;
  string start_date = 8;
  string end_date = 9;
  string grace_period_end_date = 10;
  bool billing_retry = 11;
  bool cancelled = 12;
  string environment = 13;
  int64 events = 14;
}

message ListAdminSubscriptionsResponse {
  repeated AdminSubscriptionRow rows = 1;
  int64 total = 2;
}

// environment takes production (default), sandbox or all.
message GetAdminSubscriptionSummaryRequest {
  string environment = 1;
  repeated string exclude_user_ids = 2;
}

// products lists the product ids seen, for the product filter.
message GetAdminSubscriptionSummaryResponse {
  int64 total = 1;
  int64 active = 2;
  int64 grace = 3;
  int64 billing_retry = 4;
  int64 stale_active = 5;
  int64 auto_renew_on = 6;
  int64 expiring_7d = 7;
  repeated string products = 8;
}

message ListAdminSubscriptionTransactionsRequest {
  int64 subscription_id = 1;
  repeated string exclude_user_ids = 2;
}

// Times are RFC3339.
message AdminPaymentEvent {
  int64 id = 1;
  string event_kind = 2;
  string transaction_id = 3;
  string status = 4;
  string product_id = 5;
  int64 price_micros = 6;
  string currency = 7;
  string period_start = 8;
  string period_end = 9;
  string created_at = 10;
}

message ListAdminSubscriptionTransactionsResponse {
  AdminSubscriptionRow subscription = 1;
  repeated AdminPaymentEvent events = 2;
}
